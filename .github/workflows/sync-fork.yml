name: Sync Specific Files

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 你的仓库
        uses: actions/checkout@v4

      - name: 同步文件
        run: |
          # 开启调试模式，在日志里打印正在执行的命令，方便排错
          set -x 
          
          UPSTREAM_OWNER="Darklessing"
          UPSTREAM_REPO="catvod"
          SOURCE_FILE1="douer/index.js"
          SOURCE_FILE2="douer/index.js.md5"
          DEST_DIR="Node"
          
          # 1. 浅克隆原仓库 (--depth 1 速度极快，默认自动跟随原仓库的默认分支，不用管 main 还是 master)
          echo "⬇️ 正在克隆上游仓库..."
          git clone --depth 1 https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git upstream-temp || { echo "❌ 克隆失败，请检查仓库名是否正确或是否为公开仓库"; exit 1; }

          cd upstream-temp

          # 2. 检查文件是否存在（这是为了避免后面 copy 报错）
          echo "🔍 正在检查源文件是否存在..."
          if [ ! -f "${SOURCE_FILE1}" ] || [ ! -f "${SOURCE_FILE2}" ]; then
            echo "❌ 找不到目标文件！"
            echo "当前上游仓库根目录下的文件/文件夹如下："
            ls -la
            echo "当前路径是：$(pwd)"
            exit 1
          fi

          # 3. 拷贝文件
          echo "📦 正在拷贝文件..."
          cd ..
          mkdir -p ${DEST_DIR}
          cp upstream-temp/${SOURCE_FILE1} ${DEST_DIR}/index.js
          cp upstream-temp/${SOURCE_FILE2} ${DEST_DIR}/index.js.md5

          # 4. 清理临时目录
          rm -rf upstream-temp

          # 5. 提交并推送
          echo "🚀 正在提交更改..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${DEST_DIR}/
          
          if git diff --cached --quiet; then
            echo "✅ 文件没有变化，无需提交。"
          else
            git commit -m "chore: 自动同步特定文件"
            git push
            echo "🎉 同步完成并已推送！"
          fi
