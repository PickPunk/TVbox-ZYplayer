name: Sync Files

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 同步文件并推送
        run: |
          # 1. 浅克隆原仓库
          git clone --depth 1 https://github.com/Darklessing/catvod.git temp-upstream
          
          # 2. 拷贝文件到目标目录
          mkdir -p Node
          cp temp-upstream/niuer/index.js Node/index.js
          cp temp-upstream/niuer/index.js.md5 Node/index.js.md5
          
          # 3. 清理临时文件
          rm -rf temp-upstream
          
          # 4. 提交并推送（如果没有变化则跳过提交）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Node/
          git diff --staged --quiet || (git commit -m "Auto sync files" && git push)
