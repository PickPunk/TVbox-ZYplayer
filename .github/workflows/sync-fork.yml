# .github/workflows/sync-workflow.yml
name: Sync Files
on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点运行一次（可根据需要调整）
  workflow_dispatch:     # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run Files Sync
        uses: raven-actions/repo-files-sync@v0.1.0-rc.18
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
